<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Product view with share button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Staatliches&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FFFB1}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Nunito, system-ui, sans-serif; color: #ffffff; background: #1F2170">

  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 70px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; opacity: 0.35">
    <div style="aspect-ratio: 1; border-radius: 12px; background: #25277C; border: 1.5px solid #5357C2"></div>
    <div style="aspect-ratio: 1; border-radius: 12px; background: #25277C; border: 1.5px solid #5357C2"></div>
    <div style="aspect-ratio: 1; border-radius: 12px; background: #25277C; border: 1.5px solid #5357C2"></div>
    <div style="aspect-ratio: 1; border-radius: 12px; background: #25277C; border: 1.5px solid #5357C2"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,16,60,0.6)"></div>

  <div role="dialog" aria-label="Demon Slayer" style="position: absolute; left: 0; right: 0; bottom: 0; top: 40px; display: flex; flex-direction: column; background: #25277C; border-top: 1.5px solid #5357C2; border-radius: 20px 20px 0 0; overflow: hidden">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 999px; background: #5357C2; margin: 8px auto; flex: none"></div>

    <div style="position: relative; aspect-ratio: 1; flex: none; display: grid; place-items: center; background: repeating-linear-gradient(135deg, #1F2170 0 14px, #24267a 14px 28px)">
      <span style="font-size: 12px; font-weight: 700; color: #D7CEEA">[Foto del producto]</span>
      <button aria-label="Cerrar" style="position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #5357C2; background: rgba(31,33,112,0.85); color: #ffffff; font-size: 22px; line-height: 1">×</button>
      <button aria-label="Ver las 19 fotos" style="position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid #3FFFB1; background: rgba(31,33,112,0.85); color: #3FFFB1; font: inherit; font-size: 12px; font-weight: 800">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        19 fotos
      </button>
    </div>

    <div aria-hidden="true" style="display: flex; gap: 6px; padding: 8px 16px 0; flex: none">
      <div style="width: 54px; height: 54px; border-radius: 10px; border: 2px solid #3FFFB1; background: #1F2170"></div>
      <div style="width: 54px; height: 54px; border-radius: 10px; background: #1F2170; opacity: 0.6"></div>
      <div style="width: 54px; height: 54px; border-radius: 10px; background: #1F2170; opacity: 0.6"></div>
      <div style="width: 54px; height: 54px; border-radius: 10px; background: #1F2170; opacity: 0.6"></div>
      <div style="width: 54px; height: 54px; border-radius: 10px; background: #1F2170; opacity: 0.6"></div>
      <div style="width: 54px; height: 54px; border-radius: 10px; background: #1F2170; opacity: 0.6"></div>
    </div>

    <div style="padding: 12px 16px 0">
      <h2 style="margin: 0; font-family: Staatliches, Impact, sans-serif; font-weight: 400; font-size: 30px; line-height: 1; letter-spacing: 0.02em">Demon Slayer</h2>
      <span style="display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(165,127,255,0.25); color: #CDB8FF">Keycaps</span>
    </div>

    <div style="margin-top: auto; padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 10px">
      <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; background: linear-gradient(90deg, #3FFFB1, #A57FFF); color: #2E3192; font-weight: 800; font-size: 16px; text-decoration: none">
        <span style="width: 30px; height: 30px; border-radius: 999px; background: #2E3192; display: grid; place-items: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#25D366" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg>
        </span>
        Consultar este producto
      </a>
      <button style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 12px; border: 1.5px solid #5357C2; background: rgba(255,255,255,0.07); color: #ffffff; font: inherit; font-weight: 700; font-size: 15px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
        Compartir
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
