<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Desktop home, proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Staatliches&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FFFB1}a:hover{color:#ffffff}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; font-family: Nunito, system-ui, sans-serif; color: #ffffff; background: radial-gradient(ellipse at top, #3a3db0 0%, #2E3192 40%, #1F2170 100%)">

  <header style="background: rgba(31,33,112,0.9); border-bottom: 1.5px solid #5357C2">
    <div style="max-width: 80rem; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <button aria-label="Menú de productos" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1.5px solid #5357C2; background: rgba(255,255,255,0.07); color: #D7CEEA">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div>
        <p style="margin: 0; font-family: Staatliches, Impact, sans-serif; font-size: 22px; line-height: 1; letter-spacing: 0.02em">Arcanist's Dice</p>
        <p style="margin: 2px 0 0; font-size: 11px; color: #D7CEEA">Figuras, keycaps y dados · El Salvador</p>
      </div>
      <div style="margin-left: auto; display: flex; gap: 8px; align-items: center">
        <div style="display: flex; padding: 2px; border-radius: 999px; border: 1.5px solid #5357C2; background: rgba(255,255,255,0.07); font-size: 12px; font-weight: 800">
          <a href="#" style="padding: 5px 9px; border-radius: 999px; background: linear-gradient(90deg, #3FFFB1, #A57FFF); color: #2E3192; text-decoration: none">ES</a>
          <a href="#" style="padding: 5px 9px; border-radius: 999px; color: #D7CEEA; text-decoration: none">EN</a>
        </div>
        <a href="#" aria-label="Seguir en Instagram" style="width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; border: 1.5px solid #5357C2; background: rgba(255,255,255,0.07); color: #D7CEEA">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main style="max-width: 80rem; margin: 0 auto; padding: 24px 24px 112px; box-sizing: border-box">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 20px">
        <img src="/_blob/cbbffea65b1e1553bb9ae1d202b77ebc" alt="Arcanist's Dice" style="width: 120px; height: 120px; object-fit: contain; flex: none">
        <div>
        <h1 style="margin: 0; font-family: Staatliches, Impact, sans-serif; font-weight: 400; font-size: 48px; line-height: 1; letter-spacing: 0.02em; background: linear-gradient(90deg, #3FFFB1, #A57FFF); -webkit-background-clip: text; background-clip: text; color: transparent">Catálogo</h1>
        <p style="margin: 6px 0 0; font-size: 16px; color: #D7CEEA">Figuras, keycaps y dados impresos en resina y pintados a mano</p>
        </div>
      </div>
      <label style="flex: 0 1 420px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #5357C2; background: #25277C; color: #D7CEEA">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Buscar producto</span>
        <input type="search" placeholder="Buscar producto, serie o personaje..." style="width: 100%; padding: 12px 0; border: 0; background: transparent; color: #ffffff; font: inherit; font-size: 16px; outline: none">
      </label>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px">
      <div role="group" aria-label="Tipos" style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 700; border: 1.5px solid transparent; background: linear-gradient(90deg, #3FFFB1, #A57FFF); color: #2E3192">Todo <b style="opacity: 0.75">422</b></button>
        <button style="border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 700; border: 1.5px solid #5357C2; background: rgba(255,255,255,0.07); color: #D7CEEA">Figuras <b style="opacity: 0.65">355</b></button>
        <button style="border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 700; border: 1.5px solid #5357C2; background: rgba(255,255,255,0.07); color: #D7CEEA">Keycaps <b style="opacity: 0.65">67</b></button>
        <button style="border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 700; border: 1.5px solid #5357C2; background: rgba(255,255,255,0.07); color: #D7CEEA">Dados <span style="margin-left: 4px; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(63,255,177,0.18); color: #3FFFB1">Pronto</span></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <p style="margin: 0; font-size: 14px; color: #D7CEEA">422 productos</p>
        <div style="display: flex; gap: 2px; padding: 3px; border-radius: 12px; border: 1.5px solid #5357C2; background: rgba(255,255,255,0.07)">
          <button aria-label="Cuadrícula" style="width: 40px; height: 34px; border: 0; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(90deg, #3FFFB1, #A57FFF); color: #2E3192">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
          </button>
          <button aria-label="Lista" style="width: 40px; height: 34px; border: 0; border-radius: 9px; display: grid; place-items: center; background: transparent; color: #D7CEEA">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="4" width="5" height="5" rx="1.5"/><rect x="3.5" y="15" width="5" height="5" rx="1.5"/><path d="M12 6.5h8.5M12 17.5h8.5"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px">
      <sc-for list="{{cards}}" as="card" hint-placeholder-count="10">
        <button style="padding: 0; text-align: left; font: inherit; color: inherit; border-radius: 12px; border: 1.5px solid #5357C2; background: {{card.bg}}; overflow: hidden">
          <div style="position: relative; aspect-ratio: 1; display: grid; place-items: center; background: repeating-linear-gradient(135deg, #25277c 0 14px, #2a2c86 14px 28px)">
            <span style="font-size: 12px; font-weight: 700; color: #D7CEEA">[Portada]</span>
          </div>
          <div style="padding: 8px 10px 10px">
            <h3 style="margin: 0; font-family: Staatliches, Impact, sans-serif; font-weight: 400; font-size: 19px; line-height: 1.05; letter-spacing: 0.02em">{{card.name}}</h3>
            <span style="display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(165,127,255,0.25); color: #CDB8FF">{{card.badge}}</span>
          </div>
        </button>
      </sc-for>
    </div>
  </main>

  <a href="#" style="position: fixed; right: 24px; bottom: 24px; display: flex; align-items: center; gap: 8px; padding: 10px 16px 10px 10px; border-radius: 999px; background: linear-gradient(90deg, #3FFFB1, #A57FFF); color: #2E3192; font-weight: 800; font-size: 15px; text-decoration: none; box-shadow: 0 8px 24px rgba(10,10,50,0.45)">
    <span style="width: 30px; height: 30px; border-radius: 999px; background: #2E3192; display: grid; place-items: center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#25D366" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Z"/></svg>
    </span>
    Escríbenos
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ['Agumon', 'Aku Aku', 'Alastor', 'Anya', 'Archer', 'Arcane', 'Ashe', 'Asuka', 'Attack on Titan', 'Ayla'];
    const badges = ['Figura · Chibi', 'Figura · Busto', 'Figura', 'Figura · Chibi', 'Figura · Busto', 'Keycaps', 'Figura', 'Figura', 'Keycaps', 'Figura'];
    return {
      cards: names.map((name, i) => ({
        name,
        badge: badges[i],
        bg: (i + Math.floor(i / 5)) % 2 ? 'rgba(255,255,255,0.035)' : 'rgba(255,255,255,0.07)'
      }))
    };
  }
}
</script>
</body>
</html>
