<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>The phone's share menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Staatliches&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FFFB1}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; font-family: Nunito, system-ui, sans-serif; color: #ffffff; background: #25277C">

  <div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.45">
    <div style="margin-top: 52px; aspect-ratio: 1; background: repeating-linear-gradient(135deg, #1F2170 0 14px, #24267a 14px 28px)"></div>
    <p style="margin: 70px 16px 0; font-family: Staatliches, Impact, sans-serif; font-size: 30px; line-height: 1; letter-spacing: 0.02em">Demon Slayer</p>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.45)"></div>

  <div role="dialog" aria-label="Compartir" style="position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 22px; background: #f2f2f5; color: #1c1c22; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 52px; height: 52px; border-radius: 12px; flex: none; display: grid; place-items: center; background: linear-gradient(90deg, #3FFFB1, #A57FFF)">
        <span style="font-family: Staatliches, Impact, sans-serif; font-size: 14px; color: #2E3192">AD</span>
      </div>
      <div style="min-width: 0">
        <p style="margin: 0; font-weight: 800; font-size: 15px">Demon Slayer · Arcanist's Dice</p>
        <p style="margin: 2px 0 0; font-size: 13px; color: #55556a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">arcanistsdice.com/?p=hiko-demon-slayer</p>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center">
      <sc-for list="{{apps}}" as="app" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 56px; height: 56px; border-radius: 14px; background: {{app.color}}; display: grid; place-items: center; color: #ffffff; font-weight: 800; font-size: 18px">{{app.initial}}</div>
          <span style="font-size: 12px; color: #33333f">{{app.name}}</span>
        </div>
      </sc-for>
    </div>

    <div style="border-radius: 14px; background: #ffffff; overflow: hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-size: 15px; border-bottom: 1px solid #e3e3ea">
        <span>Copiar enlace</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#33333f" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; font-size: 15px">
        <span>Más opciones</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#33333f" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      apps: [
        { name: 'WhatsApp', initial: 'W', color: '#1f9d55' },
        { name: 'Mensajes', initial: 'M', color: '#3b82f6' },
        { name: 'Instagram', initial: 'I', color: '#b4357a' },
        { name: 'Messenger', initial: 'M', color: '#6d4ad8' }
      ]
    };
  }
}
</script>
</body>
</html>
