<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cover photo guide</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Staatliches&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FFFB1}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 880px; height: 620px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 22px; font-family: Nunito, system-ui, sans-serif; color: #ffffff; background: radial-gradient(ellipse at top, #3a3db0 0%, #2E3192 40%, #1F2170 100%)">
  <div>
    <h1 style="margin: 0; font-family: Staatliches, Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: 0.02em; background: linear-gradient(90deg, #3FFFB1, #A57FFF); -webkit-background-clip: text; background-clip: text; color: transparent">Guía de portadas</h1>
    <p style="margin: 6px 0 0; font-size: 15px; color: #D7CEEA">En Drive, la foto llamada <b style="color: #ffffff">Cover</b> es la que se ve en la tarjeta. Una por producto.</p>
  </div>

  <p style="margin: 0; font-family: Staatliches, Impact, sans-serif; font-size: 22px; letter-spacing: 0.04em; color: #3FFFB1">Sí</p>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
    <sc-for list="{{good}}" as="tile" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="aspect-ratio: 1; border-radius: 12px; border: 2px solid #3FFFB1; display: grid; place-items: center; background: repeating-linear-gradient(135deg, #25277c 0 14px, #2a2c86 14px 28px)">
          <span style="font-size: 12px; font-weight: 700; color: #D7CEEA; text-align: center; padding: 0 12px">{{tile.photo}}</span>
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 1.35; color: #ffffff">{{tile.text}}</p>
      </div>
    </sc-for>
  </div>

  <p style="margin: 0; font-family: Staatliches, Impact, sans-serif; font-size: 22px; letter-spacing: 0.04em; color: #FF7A9A">Evitar</p>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
    <sc-for list="{{bad}}" as="tile" hint-placeholder-count="4">
      <div style="display: flex; gap: 10px; align-items: flex-start">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF7A9A" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M6 6l12 12M18 6 6 18"/></svg>
        <p style="margin: 0; font-size: 13px; line-height: 1.35; color: #D7CEEA">{{tile.text}}</p>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      good: [
        { photo: '[La pieza pintada]', text: 'La pieza terminada y pintada, no el render.' },
        { photo: '[Fondo liso]', text: 'Fondo liso y oscuro o neutro, sin texto encima.' },
        { photo: '[Centrada, cuadrada]', text: 'Centrada; la tarjeta recorta en cuadrado.' },
        { photo: '[Keycap de cerca]', text: 'Keycaps: la tecla de cerca, no todo el teclado.' }
      ],
      bad: [
        { text: 'Renders grises o impresiones sin pintar como portada.' },
        { text: 'Arte promocional de otra tienda, con logos o texto.' },
        { text: 'Archivos técnicos como Scaleparts.jpg.' },
        { text: 'Fotos muy anchas: se cortan los lados.' }
      ]
    };
  }
}
</script>
</body>
</html>
